<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B CRM Scraper &amp; Lead Hub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <!-- Top Brand Header (Industrial Navy) -->
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark" id="popupBrandMark">HT</div>
        <div>
          <h1 id="popupBrandName">HOTS B2B CRM</h1>
          <p class="brand-sub" id="popupAccountSub">Mendeteksi akun...</p>
        </div>
      </div>
      <span id="siteBadge" class="site-tag">Web</span>
    </header>

    <!-- Quick Launcher Strip -->
    <section class="launch-strip">
      <button id="btnOpenDashboard" class="btn btn-navy">Dashboard</button>
      <button id="btnOpenSidePanel" class="btn btn-outline">Side Panel</button>
      <button id="btnOpenGSheet" class="btn btn-outline-green">Google Sheet</button>
    </section>

    <!-- Navigation Tabs -->
    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="scraper">Scraper Online</button>
      <button class="tab-btn" data-tab="keywords">Rekomendasi B2B</button>
      <button class="tab-btn" data-tab="settings">Pengaturan</button>
    </nav>

    <!-- TAB 1: DEEP ONLINE SCRAPER + AUTO-SCROLL MAPS -->
    <main id="tab-scraper" class="tab-panel active">
      <div class="field-row">
        <label for="targetSegment">Segmen Penyimpanan</label>
        <select id="targetSegment"></select>
      </div>

      <!-- Google Maps Auto-Scroll Panel (shown automatically on Google Maps) -->
      <div id="mapsAutoPanel" class="maps-panel hidden">
        <div class="maps-panel-head">
          <strong>Google Maps Auto-Scroll</strong>
          <select id="mapsTargetCount" title="Target jumlah hasil">
            <option value="20">Target 20</option>
            <option value="40" selected>Target 40</option>
            <option value="60">Target 60</option>
          </select>
        </div>
        <button id="btnAutoScrollMaps" class="btn btn-accent btn-full">Auto-Scroll &amp; Scrape Maps</button>
      </div>

      <!-- Standard & Deep Online Scan Buttons -->
      <div class="btn-row">
        <button id="btnScanPage" class="btn btn-accent">Deep Scan Halaman Ini</button>
        <button id="btnScanContactSubpage" class="btn btn-outline" title="Cek otomatis halaman /contact atau /contact-us website ini">Cek /contact</button>
      </div>

      <div id="statusMsg" class="status-note">
        Siap ekstrak Email, Telepon (ID &amp; ASEAN), Alamat, dan PIC langsung dari browser tanpa server lokal.
      </div>

      <div id="resultsWrapper" class="results-wrap hidden">
        <div class="results-head">
          <span id="resultCount">0 lead terdeteksi</span>
          <button id="btnClearResults" class="text-btn">Hapus</button>
        </div>
        <div id="conflictSummary" class="conflict-summary hidden"></div>
        <div id="resultsList" class="results-list"></div>
        <label class="chk-skip">
          <input type="checkbox" id="chkSkipConflicts" checked>
          <span>Otomatis lewati lead yang bentrok / sudah ada di CRM</span>
        </label>
        <div class="btn-row">
          <button id="btnPushAll" class="btn btn-green">Simpan ke CRM &amp; Sheet</button>
          <button id="btnDownloadCsv" class="btn btn-outline">Download CSV</button>
        </div>
      </div>
    </main>

    <!-- TAB 2: SMART B2B KEYWORD RECOMMENDER -->
    <main id="tab-keywords" class="tab-panel">
      <div class="field-row">
        <label for="kwIndustry">Industri B2B</label>
        <select id="kwIndustry"></select>
      </div>
      <div class="field-row">
        <label for="kwRegion">Target Daerah / Negara (pisahkan koma)</label>
        <input id="kwRegion" type="text" placeholder="contoh: Jakarta, Surabaya, Bangkok, HCMC">
      </div>
      <div class="field-row">
        <label for="kwCustomTopic">Kata Kunci Khusus (Opsional)</label>
        <input id="kwCustomTopic" type="text" placeholder="contoh: safety boots, kontraktor EPC">
      </div>
      <button id="btnGenKeywords" class="btn btn-navy btn-full">Buat Rekomendasi Keyword</button>
      <div id="keywordResults" class="kw-list"></div>
    </main>

    <!-- TAB 3: SETTINGS & CONNECTED ACCOUNT -->
    <main id="tab-settings" class="tab-panel">
      <div class="field-row">
        <label>URL Google Sheet Tracker</label>
        <input id="setGSheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/.../edit">
      </div>
      <div class="field-row">
        <label>Akun Google Terhubung (`authuser`: email atau 0, 1, 2)</label>
        <input id="setAuthUser" type="text" placeholder="contoh: aufahots@gmail.com">
      </div>
      <div class="field-row">
        <div class="label-inline">
          <label>Google Apps Script Webhook URL</label>
          <button id="btnCopyGsPopup" type="button" class="text-btn-blue">Copy Kode .gs</button>
        </div>
        <input id="setWebhookUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <div class="btn-row">
        <button id="btnSaveSettings" class="btn btn-navy">Simpan Pengaturan</button>
        <button id="btnOpenOnboarding" class="btn btn-outline">Setup Profil &amp; Segmen</button>
      </div>
      <div id="settingsStatus" class="status-note">Tersimpan lokal di Chrome &amp; sinkron dengan Dashboard.</div>
    </main>
  </div>

  <script src="b2b_keywords.js"></script>
  <script src="popup.js"></script>
</body>
</html>
